name: Build and security checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: campus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus -d campus_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Run the same security suite against PostgreSQL
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://campus:ci-only-password@localhost:5432/campus_test
      - run: cp .env.example .env
      - run: npm run seed:demo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Dependency audit
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
