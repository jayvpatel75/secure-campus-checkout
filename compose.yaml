services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: local-only-change-me
      POSTGRES_DB: campus
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - campus-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U campus -d campus']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  campus-data:
